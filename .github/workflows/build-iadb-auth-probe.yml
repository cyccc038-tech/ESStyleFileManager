name: Build iAdb Auth Probe

on:
  push:
    paths:
      - 'iadb-auth-probe/**'
      - '.github/workflows/build-iadb-auth-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch iAdb API
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/FileContainer/iAdb-api.git /tmp/iAdb-api
          mkdir -p iadb-auth-probe/app/libs
          cp /tmp/iAdb-api/release/aidl-release.aar iadb-auth-probe/app/libs/
          cp /tmp/iAdb-api/release/api-release.aar iadb-auth-probe/app/libs/
          cp /tmp/iAdb-api/release/provider-release.aar iadb-auth-probe/app/libs/
          cp /tmp/iAdb-api/release/shared-release.aar iadb-auth-probe/app/libs/
          ls -lh iadb-auth-probe/app/libs

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          gradle -p iadb-auth-probe :app:assembleDebug --stacktrace

      - name: Hash
        shell: bash
        run: |
          sha256sum iadb-auth-probe/app/build/outputs/apk/debug/app-debug.apk | tee iadb-auth-probe/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ES-V52-iAdb-Auth-Probe
          path: |
            iadb-auth-probe/app/build/outputs/apk/debug/app-debug.apk
            iadb-auth-probe/SHA256.txt
          retention-days: 3
