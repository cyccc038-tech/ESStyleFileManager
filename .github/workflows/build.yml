name: Build ESStyle APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout customizer
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch Material Files v1.7.4
        run: git clone --depth 1 --branch v1.7.4 https://github.com/zhanghai/MaterialFiles.git upstream

      - name: Apply ES-style customization
        run: python3 scripts/customize.py upstream

      - name: Build installable APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find upstream/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/ESStyleFileManager.apk
          sha256sum dist/ESStyleFileManager.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESStyleFileManager-apk
          path: |
            dist/ESStyleFileManager.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
