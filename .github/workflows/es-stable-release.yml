name: ES Stable Signed Privacy Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Required repository secrets (never commit these values):
# ES_KEYSTORE_B64       base64 of the long-term .jks/.keystore
# ES_KEYSTORE_PASSWORD  keystore password
# ES_KEY_ALIAS          key alias
# ES_KEY_PASSWORD       private-key password
#
# This workflow is intentionally manual. The public repository must never contain the private key.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to run without private signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ES_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ES_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

      - name: Download exact user-tested ES build
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors \
            'https://apps.apk4free.net/es-file-explorer/ES_File_Explorer-Premium-v4.4.3.7_build_10353-Mod.apk' \
            -o source.apk
          echo 'cdca718efd9966697940b9013b57c20057e6c8b1f86b73708bdefa487b684922  source.apk' | sha256sum -c -

      - name: Apply DEX-safe privacy blocklist without rebuilding whole APK
        run: |
          set -euxo pipefail
          cp source.apk work.apk
          mkdir dex
          for n in '' 2 3 4 5 6 7 8; do unzip -p source.apk "classes${n}.dex" > "dex/classes${n}.dex"; done
          python3 security-test/patch_dex_only.py dex/classes*.dex | tee patch-log.txt
          zip -q -d work.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          (cd dex && zip -q -9 -u ../work.apk classes.dex classes2.dex classes3.dex classes4.dex classes5.dex classes6.dex classes7.dex classes8.dex)

      - name: Align and sign with the user's permanent key
        env:
          KEYSTORE_B64: ${{ secrets.ES_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ES_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          "$BUILD_TOOLS/zipalign" -f -p 4 work.apk aligned.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out ES_File_Explorer_4.4.3.7_Privacy_Stable.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            ES_File_Explorer_4.4.3.7_Privacy_Stable.apk | tee signature.txt
          sha256sum ES_File_Explorer_4.4.3.7_Privacy_Stable.apk > SHA256SUMS.txt
          rm -f release.keystore

      - name: Upload stable release APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-Privacy-Stable-Release
          path: |
            ES_File_Explorer_4.4.3.7_Privacy_Stable.apk
            SHA256SUMS.txt
            signature.txt
            patch-log.txt
          retention-days: 30
          if-no-files-found: error
